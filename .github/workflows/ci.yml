name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs opt into more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov tokenless upload via OIDC
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # job-level so the guard `if:` can read it
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube needs full history for blame/new-code

      - name: Set up mise (node + bun)
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bun run test --coverage --reporter=junit --reporter-outfile=test-report.junit.xml

      - name: Build
        run: bun run build

      - name: Plugin native host tests
        # Runs the native plugin on EmDash's real runtime (in-memory host, no network).
        # Kept apart from the root coverage/junit run above: it needs its own module stubs, so it writes its own lcov.
        # bun reports paths relative to the package (and ../ for workspace siblings); Sonar and Codecov resolve them from the repo root.
        run: |
          bun run --cwd packages/emdash-plugin test:host --coverage --coverage-reporter=lcov --coverage-dir=../../coverage/host
          sed -i -E -e 's#^SF:\.\./\.\./#SF:#' -e 's#^SF:\.\./#SF:packages/#' -e 's#^SF:(src|tests)/#SF:packages/emdash-plugin/\1/#' coverage/host/lcov.info

      - name: Plugin admin tests
        # React component tests on a happy-dom document; the preload registers it process-wide, so they run alone.
        # Own lcov for the same reason as the host tests, with the same path rewrite.
        run: |
          bun run --cwd packages/emdash-plugin test:admin --coverage --coverage-reporter=lcov --coverage-dir=../../coverage/admin
          sed -i -E -e 's#^SF:\.\./\.\./#SF:#' -e 's#^SF:\.\./#SF:packages/#' -e 's#^SF:(src|tests)/#SF:packages/emdash-plugin/\1/#' coverage/admin/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info,./coverage/host/lcov.info,./coverage/admin/lcov.info
          use_oidc: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }} # failed tests are exactly what Test Analytics reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: ./test-report.junit.xml
          use_oidc: true

      - name: SonarQube Cloud scan
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  zizmor:
    name: Zizmor workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
