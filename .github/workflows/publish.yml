name: Publish

# release-please cuts one GitHub Release per changed package (tags like
# `core-v0.1.0`, `cli-v0.1.0`). Each published release fires this workflow, which
# publishes just that package to npm with provenance. See ADR-0002.
#
# A release-triggered run executes the workflow file AT THE TAG'S COMMIT, so a
# fix to this file never reaches already-cut tags. The workflow_dispatch input
# covers that: it publishes an existing release tag using the current (main)
# workflow file.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. core-v1.0.0)
        required: true
        type: string

# Least privilege. id-token: write is what authenticates the publish: npm
# trusted publishing exchanges the OIDC token for registry credentials — no
# NPM_TOKEN secret anywhere — and provenance keys off the same token.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm (provenance)
    runs-on: ubuntu-latest
    # Must match the environment configured on each npm package's trusted
    # publisher (npmjs.com → package → Settings → Trusted publisher:
    # GitHub Actions, repo pleaseai/statusbeam, workflow publish.yml,
    # environment npm). Add protection rules in repo settings to gate publishes.
    environment: npm
    steps:
      - name: Resolve package from the release tag
        id: pkg
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # tags: <component>-v<version> → strip the -v<version> suffix.
          component="${TAG%-v*}"
          case "$component" in
            core) dir="packages/core" ;;
            worker) dir="apps/worker" ;;
            web) dir="apps/web" ;;
            cli) dir="packages/cli" ;;
            create-statusbeam) dir="packages/create-statusbeam" ;;
            *) echo "::error::unknown release component '$component' (tag '$TAG')"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Publishing $dir for tag $TAG"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the tagged tree in both trigger modes (checkout would default
          # to the default branch on workflow_dispatch).
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pin to the repo's declared packageManager so release-to-release builds
          # don't drift with a moving `latest`.
          bun-version: 1.3.14
          # This workflow is release-triggered and publishes to npm; a poisoned
          # cache could taint the tarball, so disable caching (zizmor cache-poisoning).
          # node + npm (used for the provenance publish) come from the runner's
          # preinstalled toolchain — no actions/setup-node, which would re-introduce
          # a cache-capable action into the publish path.
          no-cache: true

      - name: Install dependencies
        # --ignore-scripts: a release-triggered publish must not run arbitrary
        # dependency lifecycle scripts (supply-chain hardening). The build below
        # still works — esbuild/workerd resolve their platform binaries via
        # optionalDependencies, not postinstall.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Quality gate
        # A GitHub Release can be cut from any commit (e.g. a manual release off a
        # branch), not only release-please's main-gated one — so re-run the same
        # checks here before publishing, so a red build can never reach npm.
        run: |
          bun run lint
          bun run typecheck
          bun run test

      - name: Build
        # Builds the workspace so core/cli/create-statusbeam emit their dist/.
        run: bun run build

      - name: Pack + publish with provenance
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          # Trusted publishing needs npm >= 11.5.1; the runner's preinstalled
          # node ships an older one. Version-pinned global install, no cache.
          npm install -g npm@^11.5.1
          dest="$RUNNER_TEMP/pack"
          mkdir -p "$dest"
          # bun pm pack rewrites workspace:* deps to real versions in the tarball.
          bun pm pack --destination "$dest"
          tarball="$(find "$dest" -name '*.tgz' | head -1)"
          if [ -z "$tarball" ]; then
            echo "::error::no tarball produced by bun pm pack"; exit 1
          fi
          # Publish from outside the repo checkout: inside the Bun workspaces
          # monorepo npm enters workspace mode and `npm publish <tarball>` dies
          # with ENOWORKSPACES. No token/config-set — auth is the trusted
          # publisher OIDC exchange, which also emits the provenance attestation
          # (npm, not bun: only npm implements it).
          cd "$dest"
          npm publish "$tarball" --provenance --access public
